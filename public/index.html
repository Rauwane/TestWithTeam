<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idea Prompting Application</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Idea Prompting Application</h1>
    <form id="idea-form">
      <textarea id="idea-input" placeholder="Enter your idea here..."></textarea>
      <button type="submit">Generate Automation Plan</button>
    </form>
    <div id="automation-plan"></div>
  </div>
  <script>
    document.getElementById('idea-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const idea = document.getElementById('idea-input').value;
      const response = await fetch('/prompt', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ idea }),
      });
      const automationPlan = await response.text();
      document.getElementById('automation-plan').innerHTML = automationPlan;
    });
  </script>
</body>
</html>
